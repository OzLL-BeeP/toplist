name: toplist
description: Discover music. Share your favorites. Create your own.
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^2.24.0
  firebase_auth: ^4.14.0
  cloud_firestore: ^4.13.0
  firebase_storage: ^11.5.0

  google_sign_in: ^6.1.6

  youtube_player_flutter: ^8.1.2

  flutter_rating_bar: ^4.0.1
  cached_network_image: ^3.3.1

  provider: ^6.1.0

  intl: ^0.19.0
  http: ^1.1.0
  uuid: ^4.0.0
  url_launcher: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

# youtube_player_flutter 8.1.2 depends directly on flutter_inappwebview and
# is written against its 5.x API (passes plain Uri, not WebUri). Overriding
# to 6.x breaks compilation with a WebUri type mismatch. Overriding to an
# old 5.8.0 breaks Android builds due to a missing namespace declaration.
# 5.7.2+3 is the latest 5.x release that declares a valid Android namespace
# while keeping the Uri-based API youtube_player_flutter 8.1.2 expects.
dependency_overrides:
  flutter_inappwebview: 5.7.2+3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

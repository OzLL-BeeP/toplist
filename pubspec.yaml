name: toplist
description: Discover music. Share your favorites. Create your own.
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.14.0
  firebase_auth: ^6.6.0
  cloud_firestore: ^6.0.4
  firebase_storage: ^13.0.4

  google_sign_in: ^6.1.6

  youtube_player_flutter: ^10.0.1

  flutter_rating_bar: ^4.0.1
  cached_network_image: ^3.3.1

  provider: ^6.1.0

  intl: ^0.19.0
  http: ^1.1.0
  uuid: ^4.0.0
  url_launcher: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

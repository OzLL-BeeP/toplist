name: toplist
description: Discover music. Share your favorites. Create your own.
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^2.24.0
  firebase_auth: ^4.14.0
  cloud_firestore: ^4.13.0
  firebase_storage: ^11.5.0

  google_sign_in: ^6.1.6

  youtube_player_flutter: ^8.1.2

  flutter_rating_bar: ^4.0.1
  cached_network_image: ^3.3.1

  provider: ^6.1.0

  intl: ^0.19.0
  http: ^1.1.0
  uuid: ^4.0.0
  url_launcher: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

# flutter_inappwebview is pulled in transitively by another package at
# an old version (5.8.0) that has no Android namespace declared, which
# breaks AGP 8.x builds requiring an explicit namespace. This override
# forces resolution to a modern release that declares one properly.
# See: requirement to upgrade rather than patch .pub-cache directly.
dependency_overrides:
  flutter_inappwebview: ^6.1.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

name: toplist
description: Music sharing & social platform with YouTube integration
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.14.0
  cloud_firestore: ^4.13.0
  firebase_storage: ^11.5.0

  # Google Sign-In
  google_sign_in: ^6.1.6

  # YouTube Player
  youtube_player_flutter: ^8.1.2

  # UI Components
  flutter_rating_bar: ^4.0.1
  cached_network_image: ^3.3.1
  
  # State Management
  provider: ^6.1.0

  # Utilities
  intl: ^0.19.0
  http: ^1.1.0
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/

  # Fonts
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

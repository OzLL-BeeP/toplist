name: Flutter Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Decode Firebase google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e

          mkdir -p android/app

          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON secret is missing from GitHub Actions."
            echo "Add it under repo Settings > Secrets and variables > Actions > New repository secret,"
            echo "named GOOGLE_SERVICES_JSON, containing the Base64-encoded contents of your"
            echo "real google-services.json file."
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

          test -s android/app/google-services.json || {
            echo "ERROR: Failed to decode GOOGLE_SERVICES_JSON, or the resulting file is empty."
            exit 1
          }

          echo "google-services.json created successfully (contents not printed for security)."

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release -t lib/main.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: toplist-release-apk
          path: build/app/outputs/flutter-apk/*.apk

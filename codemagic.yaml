workflows:
  toplist-android:
    name: TopList Android Build
    max_build_duration: 60

    environment:
      groups:
        - firebase_credentials
      flutter: stable
      java: 21

    scripts:
      - name: Decode Firebase configuration
        script: |
          set -e
          mkdir -p android/app

          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON is missing."
            exit 1
          fi

          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

          test -s android/app/google-services.json || {
            echo "ERROR: Failed to create google-services.json"
            exit 1
          }

          echo "google-services.json created successfully."

      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Build Android AAB
        script: |
          flutter build appbundle --debug

    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - spsrepet@gmail.com

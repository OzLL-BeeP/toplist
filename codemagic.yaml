workflows:
  toplist-android:
    name: TopList Android Build
    max_build_duration: 60

    environment:
      flutter: stable
      java: 21
      groups:
        - firebase_credentials

    scripts:
      - name: Decode Firebase configuration
        script: |
          set -e

          echo "Checking Firebase secret..."

          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON is missing."
            echo "Make sure the variable exists in the firebase_credentials group."
            exit 1
          fi

          mkdir -p android/app

          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

          if [ ! -s android/app/google-services.json ]; then
            echo "ERROR: google-services.json was not created."
            exit 1
          fi

          echo "Firebase configuration created successfully."
          ls -lh android/app/google-services.json

      - name: Verify Firebase configuration
        script: |
          set -e

          if [ ! -f android/app/google-services.json ]; then
            echo "ERROR: android/app/google-services.json does not exist."
            exit 1
          fi

          echo "OK: Firebase configuration file exists."

      - name: Build Android
        script: |
          flutter pub get
          flutter build appbundle --debug

    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - spsrepet@gmail.com

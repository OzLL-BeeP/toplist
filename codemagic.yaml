workflows:
  toplist-android:
    name: TopList Android Build
    max_build_duration: 60

    environment:
      flutter: stable
      java: 21

    scripts:
      - name: Check environment
       script: |
        echo "Checking Codemagic environment..."

        if [ -n "$GOOGLE_SERVICES_JSON" ]; then
          echo "GOOGLE_SERVICES_JSON = FOUND"
        else
          echo "GOOGLE_SERVICES_JSON = MISSING"
    fi

      - name: Decode Firebase configuration
        script: |
          set -e

          mkdir -p android/app

          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

          test -s android/app/google-services.json

          echo "Firebase configuration created successfully."

      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Build Android APK
        script: |
          flutter build apk --release -t lib/main.dart

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

workflows:
  toplist-android:
    name: TopList Android Build
    max_build_duration: 60

    environment:
      flutter: stable
      java: 21

    scripts:
      - name: Decode Firebase configuration
        script: |
          set -e

          echo "Checking Firebase secret..."

          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON is missing."
            echo "Make sure GOOGLE_SERVICES_JSON exists in the firebase_credentials group."
            exit 1
          fi

          mkdir -p android/app

          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

          if [ ! -s android/app/google-services.json ]; then
            echo "ERROR: google-services.json was not created."
            exit 1
          fi

          echo "Firebase configuration created successfully."

      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Build Android APK
        script: |
          flutter build apk --release -t lib/main.dart

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      email:
        recipients:
          - spsrepet@gmail.com

workflows:
  toplist-android:
    name: TopList Android Build
    max_build_duration: 60

    environment:
      flutter: stable
      java: 21

    scripts:
      - name: Check Firebase secret
        script: |
          set -e

          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON is missing from Codemagic."
            exit 1
          fi

          echo "Firebase secret detected."

      - name: Decode Firebase configuration
        script: |
          set -e

          mkdir -p android/app

          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

          test -s android/app/google-services.json

          echo "Firebase configuration created successfully."

      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Build Android APK
        script: |
          flutter build apk --release -t lib/main.dart

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
